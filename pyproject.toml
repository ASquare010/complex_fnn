[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-fnn"
version = "0.3.0"
description = "Atlas: controlled experiments on compact reusable computation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "torch>=2.6,<3", "tokenizers>=0.21,<1"]

[project.optional-dependencies]
data = ["datasets>=3.6,<5"]
notebook = ["datasets>=3.6,<5", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "rapidfuzz>=3,<4"]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[project.scripts]
fnnlab = "main:main"

[tool.setuptools]
py-modules = ["main", "settings", "storage"]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
config = ["*.json", "data/*.json"]

[tool.ruff]
line-length = 100
extend-exclude = ["dump"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
